services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: scoretracker-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_password123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123' -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scoretracker-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SQL__ConnectionString: "Server=db,1433;Database=ScoreTracker;User Id=sa;Password=Your_password123;TrustServerCertificate=true;Encrypt=false"
      AutoMigrate: "true"
      DevAuth__Enabled: "true"
      CommunityTools__AllowPrivateWebhookTargets: "true"
      CommunityTools__AllowPublicWebhookTargets: "false"
      Discord__ClientId: "local-dev"
      Discord__ClientSecret: "local-dev"
      Google__ClientId: "local-dev"
      Google__ClientSecret: "local-dev"
      Facebook__AppId: "local-dev"
      Facebook__AppSecret: "local-dev"
      ProdSync__BaseUrl: "https://piuscores.arroweclip.se"
    ports:
      - "8080:8080"
    restart: on-failure

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: scoretracker-azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azuritedata:/data

volumes:
  sqldata:
  azuritedata:
